name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Syntax check
        run: find src routes lang tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Code style (Laravel Pint)
        run: composer lint

      # Run the tests even when the style check failed, so one problem cannot hide the other.
      - name: Unit tests (Pest)
        if: ${{ !cancelled() }}
        run: composer test

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Page script tests (jsdom)
        if: ${{ !cancelled() }}
        run: npm test
